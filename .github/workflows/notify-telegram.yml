name: Notify Telegram on new digest

on:
  push:
    branches: [main]
    paths:
      - 'magazines/*.html'
  workflow_dispatch:
    inputs:
      digest_date:
        description: 'Дата выпуска (ДД-ММ-ГГГГ); пусто = последний доступный'
        required: false
        type: string

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Find new digest file
        id: find
        env:
          REQUESTED_DATE: ${{ inputs.digest_date }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ -n "$REQUESTED_DATE" ]; then
              if ! [[ "$REQUESTED_DATE" =~ ^[0-9]{2}-[0-9]{2}-[0-9]{4}$ ]]; then
                echo "Expected digest_date format DD-MM-YYYY" >&2
                exit 1
              fi
              NEW_FILE="magazines/${REQUESTED_DATE}.html"
              if [ ! -f "$NEW_FILE" ]; then
                echo "Digest file does not exist: $NEW_FILE" >&2
                exit 1
              fi
            else
              LATEST=$(find magazines -maxdepth 1 -type f -name '??-??-????.html' -printf '%f\n' |
                awk -F'[-.]' '{ print $3 $2 $1, $0 }' | sort -r | head -n 1 | cut -d' ' -f2)
              if [ -z "$LATEST" ]; then
                echo "No digest HTML files found" >&2
                exit 1
              fi
              NEW_FILE="magazines/$LATEST"
            fi
          else
            NEW_FILE=$(git diff --name-only --diff-filter=A HEAD^ HEAD \
              | grep '^magazines/.*\.html

          if [ -z "$NEW_FILE" ] && [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
            NEW_FILE=$(git diff --name-only --diff-filter=M HEAD^ HEAD \
              | grep '^magazines/.*\.html

          if [ -z "$NEW_FILE" ]; then
            echo "file=" >> $GITHUB_OUTPUT
            echo "date=" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "file=$NEW_FILE" >> $GITHUB_OUTPUT

          BASENAME=$(basename "$NEW_FILE" .html)
          echo "date=$BASENAME" >> $GITHUB_OUTPUT

      - name: Wait for GitHub Pages deploy
        if: steps.find.outputs.file != ''
        run: sleep 60

      - name: Send to Telegram
        if: steps.find.outputs.file != ''
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_CHAT_ID_2: ${{ secrets.TG_CHAT_ID_2 }}
          DATE: ${{ steps.find.outputs.date }}
        run: |
          URL="https://teemalex18.github.io/AdTech-digest/magazines/${DATE}.html"

          if [ -f tg_summary.txt ]; then
            SUMMARY=$(cat tg_summary.txt)
          else
            SUMMARY="AdTech-дайджест за ${DATE}"
          fi

          FULL_TEXT="${SUMMARY}"$'\n\n'"[Полный текст выпуска](${URL})"

          for CHAT_ID in "${TG_CHAT_ID}" "${TG_CHAT_ID_2}"; do
            if [ -z "${CHAT_ID}" ]; then
              continue
            fi

            curl --fail-with-body -sS "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
              -d chat_id="${CHAT_ID}" \
              -d parse_mode=Markdown \
              -d disable_web_page_preview=true \
              --data-urlencode "text=${FULL_TEXT}"
          done
 | head -n 1)
          fi

          if [ -z "$NEW_FILE" ]; then
            NEW_FILE=$(git diff --name-only --diff-filter=M HEAD^ HEAD \
              | grep '^magazines/.*\.html$' | head -n 1)
          fi

          if [ -z "$NEW_FILE" ]; then
            echo "file=" >> $GITHUB_OUTPUT
            echo "date=" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "file=$NEW_FILE" >> $GITHUB_OUTPUT

          BASENAME=$(basename "$NEW_FILE" .html)
          echo "date=$BASENAME" >> $GITHUB_OUTPUT

      - name: Wait for GitHub Pages deploy
